    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #C41E3A;
            --primary-light: #E63946;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #D32F2F;
            --info: #0ea5e9;
            --muted: #a8a29e;
            --neutral-50: #FFFAF0;
            --neutral-100: #FFF5E6;
            --neutral-200: #F5E6D3;
            --neutral-300: #E6D2BA;
            --neutral-400: #B89F86;
            --neutral-700: #5C4033;
            --neutral-900: #3E2723;
            --cream: #F5F1EA;
            --gold: #D4AF37;
            --page-bg: #f9f5ef;
            --card-bg: #fffdfb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--page-bg);
            color: var(--neutral-900);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
            animation: slideDown 0.6s ease-out;
            border: 1px solid rgba(196, 30, 58, 0.08);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--neutral-700);
            font-size: 15px;
        }

        /* Tabs */
        .tabs {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(196, 30, 58, 0.08);
            margin-bottom: 24px;
        }

            flex-shrink: 0;
